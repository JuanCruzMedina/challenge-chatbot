[project]
name = "ecosystem-assistant"
version = "0.1.0"
description = "Multi-source documentation chatbot for a microservices ecosystem (challenge project)."
requires-python = ">=3.12"
dependencies = [
    "mcp~=2.3",
    "networkx~=3.7",
    "pyyaml~=6.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecosystem_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
